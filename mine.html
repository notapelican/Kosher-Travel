<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My ratings — Kosher Travel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d6b63'/%3E%3Cpath d='M27.5 4.5 6 14l6.4 2.8z' fill='%23fff'/%3E%3Cpath d='M12.4 16.8 15.2 23.2 27.5 4.5z' fill='%23fff' fill-opacity='.68'/%3E%3Crect x='5' y='24.4' width='22' height='3.4' rx='1.7' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0d6b63">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>
  <div class="wrap wrap-narrow">
    <div class="page-head">
      <h1>My ratings</h1>
      <p>Edit or delete anything you have posted. Ratings you posted anonymously are marked below —
         they show as “Anonymous” to everyone else, and nothing on the public site links them to your
         other ratings.</p>
    </div>
    <div id="page-notice"></div>
    <div class="notice" id="list-msg" hidden></div>

    <div class="card" id="name-card" hidden style="margin-bottom:20px">
      <form id="name-form" style="display:flex;gap:var(--sp-3);align-items:end;flex-wrap:wrap">
        <div class="field" style="margin:0;flex:1;min-width:220px">
          <label for="display_name">Display name
            <span class="hint">signs the ratings you post under your name — leave it blank to show
              as “Traveler”. It does not have to be your real name.</span></label>
          <input id="display_name" maxlength="60" placeholder="Traveler">
        </div>
        <button type="submit">Save name</button>
      </form>
    </div>

    <div class="reviews" id="reviews"></div>
  </div>
</main>
<footer class="site-footer"><div class="wrap">Kosher Travel</div></footer>
<script type="module" src="js/mine.js"></script>
</body>
</html>
